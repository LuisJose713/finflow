name: One-time safe dependency repair (isolated Angular 22 branch)

on:
  push:
    branches: [security/audit-prod-deps-20261109]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Patch dependencies without force or major migrations
        shell: bash
        run: |
          npm ci
          npm audit fix --audit-level=high --no-fund || true
          npm ci
      - name: Verify no high-risk advisories
        shell: bash
        run: |
          npm audit --json > audit-full-after-fix.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('audit-full-after-fix.json','utf8'));
          if (report.error) throw new Error('npm audit failed to complete');
          const counts = report.metadata?.vulnerabilities || {};
          console.log('Post-fix npm advisory counts:', JSON.stringify(counts));
          if ((counts.high || 0) + (counts.critical || 0) > 0) {
            throw new Error('High/critical advisories remain. No changes will be committed.');
          }
          NODE
      - name: Compile Angular 22 release
        run: |
          npx tsc --noEmit --project tsconfig.app.json
          npm run build:prod
      - name: Commit safe package and lockfile patches
        shell: bash
        run: |
          set -euo pipefail
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore(security): fix transitive development dependency advisories"
          git push origin HEAD:security/audit-prod-deps-20261109
