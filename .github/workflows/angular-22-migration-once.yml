name: One-time Angular 18 to 22 migration (isolated branch)

on:
  push:
    branches: [chore/angular-22-migration-20261109]

# This workflow runs only on the isolated, owner-controlled migration branch.
# It removes itself before committing the migration, and does not target production.
permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Install current lockfile
        run: npm ci
      - name: Apply official major-by-major Angular migrations
        shell: bash
        run: |
          set -euo pipefail
          for major in 19 20 21 22; do
            echo "::group::Angular major $major"
            npx ng update "@angular/core@$major" "@angular/cli@$major" --allow-dirty
            echo "::endgroup::"
          done
      - name: Update CI Node to supported version
        run: |
          sed -i "s/node-version: '20'/node-version: '22.22.3'/" .github/workflows/angular-ci.yml
      - name: Remove deprecated TypeScript 6 baseUrl setting
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const p="tsconfig.json"; const j=JSON.parse(fs.readFileSync(p, "utf8")); delete j.compilerOptions.baseUrl; for(const key of Object.keys(j.compilerOptions.paths || {})){ j.compilerOptions.paths[key] = j.compilerOptions.paths[key].map(x=>x.startsWith(".") ? x : "./" + x); } fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");'
      - name: Verify reproducibility and compile
        run: |
          npm ci
          npx tsc --noEmit --project tsconfig.app.json
          npm run build:prod
      - name: Commit verified migration and remove one-time automation
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/angular-22-migration-once.yml
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(web): migrate Angular 18 to 22 using official update schematics'
          git push origin HEAD:chore/angular-22-migration-20261109
