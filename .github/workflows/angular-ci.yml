name: Angular quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: angular-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npx tsc --noEmit --project tsconfig.app.json
      - name: Verify FinFlow brand
        run: node scripts/verify-brand.mjs
      - name: Production build
        run: npm run build:prod
      - name: Authentication regression tests (Chrome Headless)
        run: npm test -- --watch=false --browsers=ChromeHeadless --include=src/app/core/interceptors/auth.interceptor.spec.ts
      - name: Dashboard and currency regression tests (Chrome Headless)
        run: npm test -- --watch=false --browsers=ChromeHeadless --include='src/app/features/dashboard/**/*.spec.ts' --include=src/app/shared/pipes/currency.pipe.spec.ts
      - name: Session guard regression tests (Chrome Headless)
        run: npm test -- --watch=false --browsers=ChromeHeadless --include=src/app/core/guards/session-token.spec.ts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
