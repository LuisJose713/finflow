name: FinFlow Disponible unit tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finances:
    name: Validate cashflow calculations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check Chrome availability
        run: google-chrome --version
      - name: Run FinFlow Disponible Jasmine cases
        run: npx ng test --watch=false --browsers=ChromeHeadless --include=src/app/core/utils/disponible-calculator.spec.ts
