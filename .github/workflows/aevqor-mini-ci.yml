name: AEVQOR Control - Seguridad CI
on:
  push:
    branches: [aevqor-control-v0.1]
    paths:
      - "aevqor-control/**"
      - ".github/workflows/aevqor-mini-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-mini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r aevqor-control/requirements-mini.txt pytest
      - name: Syntax validation
        run: python -m compileall -q aevqor-control/security_agent_mini.py aevqor-control/setup_mini.py
      - name: Tests
        run: python -m pytest -q aevqor-control/tests/test_security_agent_mini.py
