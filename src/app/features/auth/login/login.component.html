 <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h1>FinFlow</h1>
          <p>Inicia sesión en tu cuenta</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input
              id="email"
              type="email"
              autocomplete="email"
              inputmode="email"
              formControlName="email"
              placeholder="tu@correo.com"
              [class.input-error]="email?.invalid && email?.touched"
            />
            @if (email?.invalid && email?.touched) {
              <span class="error-msg">Correo inválido</span>
            }
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              formControlName="password"
              placeholder="••••••••"
              [class.input-error]="password?.invalid && password?.touched"
            />
            @if (password?.invalid && password?.touched) {
              <span class="error-msg">Mínimo 6 caracteres</span>
            }
          </div>

          @if (errorMsg()) {
            <div class="alert-error" role="alert" aria-live="polite">{{ errorMsg() }}</div>
          }

          <button type="submit" class="btn-primary" [disabled]="loading()">
            {{ loading() ? 'Ingresando...' : 'Iniciar sesión' }}
          </button>
        </form>

        <p class="auth-footer">
          ¿No tienes cuenta?
          <a routerLink="/register">Regístrate</a>
        </p>
      </div>
    </div>
