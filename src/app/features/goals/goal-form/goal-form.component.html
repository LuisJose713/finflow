<div *ngIf="isOpen()" class="modal-backdrop" (click)="close()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ editGoal() ? "Editar meta" : "Nueva meta" }}</h2>
      <button class="btn-close" (click)="close()">✕</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Título de la meta</label>
        <input
          type="text"
          formControlName="title"
          placeholder="Ej: Fondo de emergencia"
          [class.error]="f['title'].invalid && f['title'].touched"
        />
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Monto objetivo</label>
          <input
            type="number"
            formControlName="targetAmount"
            placeholder="0.00"
            min="1"
          />
        </div>

        <div class="form-group">
          <label>Monto actual</label>
          <input
            type="number"
            formControlName="currentAmount"
            placeholder="0.00"
            min="0"
          />
        </div>

        <div class="form-group full-width">
          <label>Fecha límite</label>
          <input type="date" formControlName="deadline" />
        </div>
      </div>

      <div class="form-group">
        <label>Descripción (opcional)</label>
        <textarea
          formControlName="description"
          rows="2"
          placeholder="¿Para qué es esta meta?"
        ></textarea>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-cancel" (click)="close()">
          Cancelar
        </button>
        <button type="submit" class="btn-submit" [disabled]="loading()">
          {{
            loading()
              ? "Guardando..."
              : editGoal()
                ? "Actualizar"
                : "Crear meta"
          }}
        </button>
      </div>
    </form>
  </div>
</div>
