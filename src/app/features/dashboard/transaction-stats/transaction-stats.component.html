<div class="stats-card">
  <div class="card-header">
    <h2>Resumen anual</h2>
    <div class="filter-btns">
      <button [class.active]="filter() === 'all'" (click)="setFilter('all')">Todo</button>
      <button [class.active]="filter() === 'income'" (click)="setFilter('income')">Ingresos</button>
      <button [class.active]="filter() === 'expense'" (click)="setFilter('expense')">Egresos</button>
    </div>
  </div>

  <div class="totals">
    <div class="total income">
      <span class="label">Total ingresos</span>
      <span class="value">+${{ totalIncome.toLocaleString() }}</span>
    </div>
    <div class="total expense">
      <span class="label">Total egresos</span>
      <span class="value">-${{ totalExpenses.toLocaleString() }}</span>
    </div>
  </div>

  <ng-container *ngIf="loading()">
    <div class="skeleton-chart"></div>
  </ng-container>

  <div *ngIf="!loading()" class="chart-wrapper">
    <canvas #chartCanvas></canvas>
  </div>
</div>
<app-transaction-stats />
