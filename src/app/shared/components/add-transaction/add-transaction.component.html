<!-- Trigger button -->
<button class="btn-add" (click)="open()">+ Nueva transacción</button>

<!-- Modal backdrop -->
<div *ngIf="isOpen()" class="modal-backdrop" (click)="close()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Nueva transacción</h2>
      <button class="btn-close" (click)="close()">✕</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <!-- Type toggle -->
      <div class="type-toggle">
        <button
          type="button"
          class="type-btn"
          [class.active]="form.value.type === 'income'"
          (click)="form.patchValue({ type: 'income' })"
        >
          ↑ Ingreso
        </button>
        <button
          type="button"
          class="type-btn expense"
          [class.active]="form.value.type === 'expense'"
          (click)="form.patchValue({ type: 'expense' })"
        >
          ↓ Gasto
        </button>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Descripción</label>
          <input
            type="text"
            formControlName="description"
            placeholder="Ej: Salario mensual"
            [class.error]="f['description'].invalid && f['description'].touched"
          />
        </div>

        <div class="form-group">
          <label>Monto</label>
          <input
            type="number"
            formControlName="amount"
            placeholder="0.00"
            min="0"
            step="0.01"
            [class.error]="f['amount'].invalid && f['amount'].touched"
          />
        </div>

        <div class="form-group">
          <label>Categoría</label>
          <select
            formControlName="categoryId"
            [class.error]="f['categoryId'].invalid && f['categoryId'].touched"
          >
            <option [ngValue]="null" disabled>Selecciona una categoría</option>
            <option *ngFor="let cat of filteredCategories()" [ngValue]="cat.id">
              {{ cat.name }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label>Fecha</label>
          <input type="date" formControlName="date" />
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-cancel" (click)="close()">
          Cancelar
        </button>
        <button type="submit" class="btn-submit" [disabled]="loading()">
          {{ loading() ? "Guardando..." : "Guardar" }}
        </button>
      </div>
    </form>
  </div>
</div>
