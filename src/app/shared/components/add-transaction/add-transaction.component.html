<!-- Trigger button -->
<button class="btn-add" (click)="open()">+ Nueva transacción</button>

<!-- Modal backdrop -->
<div *ngIf="isOpen()" class="modal-backdrop" (click)="close()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="transaction-dialog-title" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 id="transaction-dialog-title">Nueva transacción</h2>
      <button type="button" class="btn-close" (click)="close()" aria-label="Cerrar formulario">✕</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <!-- Type toggle -->
      <div class="type-toggle">
        <button
          type="button"
          class="type-btn"
          [class.active]="form.value.type === 'income'"
          (click)="form.patchValue({ type: 'income' })"
        >
          ↑ Ingreso
        </button>
        <button
          type="button"
          class="type-btn expense"
          [class.active]="form.value.type === 'expense'"
          (click)="form.patchValue({ type: 'expense' })"
        >
          ↓ Gasto
        </button>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Título</label>
          <input
            type="text"
            formControlName="description"
            placeholder="Ej: Compra del supermercado"
            [class.error]="f['description'].invalid && f['description'].touched"
          />
        </div>

        <!-- Monto con formato de miles -->
        <div class="form-group">
          <label>Monto</label>
          <input
            type="text"
            inputmode="numeric"
            placeholder="0"
            [value]="amountDisplay()"
            (input)="onAmountInput($event)"
            (blur)="f['amount'].markAsTouched()"
            [class.error]="f['amount'].invalid && f['amount'].touched"
          />
        </div>

        <div class="form-group">
          <label>Categoría</label>
          <select
            formControlName="categoryId"
            [class.error]="f['categoryId'].invalid && f['categoryId'].touched"
          >
            <option [ngValue]="null" disabled>Selecciona una categoría</option>
            <option *ngFor="let cat of filteredCategories()" [ngValue]="cat.id">
              {{ cat.name }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="transaction-account">Billetera (opcional)</label>
          <select id="transaction-account" formControlName="accountId">
            <option [ngValue]="null">Sin billetera asignada</option>
            <option *ngFor="let account of accounts()" [ngValue]="account.id">{{account.name}}</option>
          </select>
        </div>

        <div class="form-group">
          <label>Fecha</label>
          <input type="date" formControlName="date" />
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-cancel" (click)="close()">Cancelar</button>
        <button type="submit" class="btn-submit" [disabled]="loading()">
          {{ loading() ? "Guardando..." : "Guardar" }}
        </button>
      </div>

    </form>
  </div>
</div>
