<button class="mobile-menu-btn" type="button" (click)="toggleMobile()" [attr.aria-expanded]="mobileOpen()" aria-controls="finflow-sidebar" [attr.aria-label]="mobileOpen() ? 'Cerrar menú' : 'Abrir menú'">☰</button>
<div class="overlay" *ngIf="mobileOpen()" (click)="closeMobile()" aria-hidden="true"></div>
<aside id="finflow-sidebar" class="sidebar" [class.collapsed]="collapsed() && !mobileOpen()" [class.open]="mobileOpen()" aria-label="Navegación principal">
  <div class="sidebar-header">
    <span class="logo" aria-hidden="true">F<span class="brand-dot">·</span></span>
    <span class="brand" *ngIf="!collapsed() || mobileOpen()">FinFlow<small>PERSONAL FINANCE</small></span>
    <button class="collapse-btn" type="button" (click)="toggleCollapse()" [attr.aria-label]="collapsed() ? 'Expandir menú' : 'Contraer menú'">{{ collapsed() ? '→' : '←' }}</button>
  </div>
  <div class="nav-group-label" *ngIf="!collapsed() || mobileOpen()">ESPACIO DE TRABAJO</div><nav class="nav" aria-label="Secciones">
    <a *ngFor="let item of navItems" [routerLink]="item.path" routerLinkActive="active" class="nav-item" [title]="item.label" (click)="closeMobile()">
      <span class="nav-icon" aria-hidden="true"><svg *ngIf="item.path === '/dashboard'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><svg *ngIf="item.path === '/goals'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg><svg *ngIf="item.path === '/accounts'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9h19M17 15h2"/></svg><svg *ngIf="item.path === '/recurring'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5 10a8 8 0 0 1 13-3l2 2M4 15l2 2a8 8 0 0 0 13-3"/></svg><svg *ngIf="item.path === '/security'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l8 4v6c0 5-3 8-8 10-5-2-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg><svg *ngIf="item.path === '/advisor'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg><svg *ngIf="item.path === '/transactions'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h10"/></svg><svg *ngIf="item.path === '/planned-expenses'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg><svg *ngIf="item.path === '/categories'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17h7m-3.5-3.5v7"/></svg><svg *ngIf="item.path === '/budgets'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 15v-3m5 3V8m5 7v-5"/></svg></span>
      <span class="nav-label" *ngIf="!collapsed() || mobileOpen()">{{ item.label }}</span>
    </a>
    <a *ngIf="auth.currentUser()?.role === 'ADMIN'" routerLink="/admin" routerLinkActive="active" class="nav-item" title="Administración" (click)="closeMobile()">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.2 8.1-8 10-4.8-1.9-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg></span>
      <span class="nav-label" *ngIf="!collapsed() || mobileOpen()">Administración</span>
    </a>
  </nav>
  <div class="sidebar-brand-credit" *ngIf="!collapsed() || mobileOpen()">Creado por <strong>AEVQOR</strong><small>Precision. Architecture. Innovation.</small></div>
  <div class="sidebar-footer">
    <app-theme-switcher [compact]="collapsed() && !mobileOpen()"></app-theme-switcher>
    <app-logout-button *ngIf="!collapsed() || mobileOpen()"></app-logout-button>
  </div>
</aside>
